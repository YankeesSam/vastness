# Builds main and replaces the "nightly" pre-release with it: one tag, one release, its files replaced every
# time (scripts/nightly-build.sh decides what exists at this point of the plan; T-008, VN-DOC-005).
#
# Runs on every push to main, which is how every session ends (vastness-handoff pushes), and the handoff then
# runs scripts/nightly.sh, which waits for this run on its HEAD (starting one by workflow_dispatch if none
# appeared) and checks what was published. The schedule rebuilds main each night only when the nightly is not
# at main already. Tests run before anything is published. The release is deleted and made afresh each time,
# so its date is the build's.

name: Nightly

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "41 6 * * *"

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  # A scheduled run stops here when the nightly tag is at main already.
  stale:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly" --jq .object.sha 2>/dev/null || true)"
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$tag" = "$GITHUB_SHA" ]; then
            echo "the nightly is at $GITHUB_SHA already"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: stale
    if: needs.stale.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Build, test and package
        id: build
        run: |
          bash scripts/nightly-build.sh nightly
          echo "version=$(node -p 'require("./nightly/build.json").version')" >> "$GITHUB_OUTPUT"

      - name: Replace the nightly pre-release
        env:
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          notes="$(mktemp)"
          {
            echo "Latest build of main, replaced at the end of every session. Not a release."
            echo
            echo "- Version: \`$VERSION\`"
            echo "- Commit: $GITHUB_SHA"
            echo "- Files (what exists at this point of the plan):"
            echo "  - \`vastness-$VERSION-web.zip\`: the static app; serve the folder over HTTP (for example \`python3 -m http.server\`), not from file://."
            echo "  - \`vastness-$VERSION-docs.zip\`: README, LICENSE, NOTICE and docs/ (requirements, roadmap, ADRs)."
            echo "  - \`THIRD_PARTY_NOTICES.txt\`: licences of the packages the app bundles."
            echo "  - \`build.json\` and \`SHA256SUMS\`."
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "Files in this build:"
            (cd nightly && ls -1 | sed 's/^/- `/; s/$/`/')
          } > "$notes"
          git tag -f nightly "$GITHUB_SHA"
          git push -f origin refs/tags/nightly
          if gh release view nightly >/dev/null 2>&1; then
            gh release delete nightly --yes
          fi
          gh release create nightly nightly/* --prerelease --latest=false --verify-tag \
            --title "Nightly ($VERSION)" --notes-file "$notes"
